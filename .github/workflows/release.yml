name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: cp app/build/outputs/apk/debug/app-debug.apk MemoryArena-v1.0.0.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Memory Arena ${{ github.ref_name }} (Android APK)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Memory Arena for Android
            Download **`MemoryArena-v1.0.0.apk`** below to install and play directly on any Android device (Android 11+).
            
            ### Quick Install Instructions:
            1. Download the `MemoryArena-v1.0.0.apk` asset below.
            2. Tap to install on your Android device (enable "Install unknown apps" if prompted).
            3. Enjoy the tabletop game!
          files: MemoryArena-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
